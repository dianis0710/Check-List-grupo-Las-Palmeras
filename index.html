<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de Viaje: ¡Nos vamos de Crucero!</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --ocean-blue: #023e8a;
            --caribbean-turquoise: #00b4d8;
            --sand-beach: #fff3b0;
            --coral-orange: #f26419;
            --foam-white: #f8f9fa;
            --dark-navy: #03045e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #caf0f8 0%, #eaf4f4 100%);
            color: #333;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--dark-navy) 0%, var(--ocean-blue) 100%);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 5px solid var(--caribbean-turquoise);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .countdown-container {
            background: #03045e;
            color: #fff3b0;
            display: block;
            text-align: center;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 3px solid var(--coral-orange);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: white;
            border: 2px solid var(--caribbean-turquoise);
            color: var(--dark-navy);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--caribbean-turquoise);
            color: white;
            border-color: var(--caribbean-turquoise);
        }

        .view-section {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .view-section.active {
            display: block;
        }

        .crew-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .crew-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .crew-card:hover {
            transform: translateY(-4px);
            border-color: var(--caribbean-turquoise);
            box-shadow: 0 10px 20px rgba(0,180,216,0.15);
        }

        .crew-avatar {
            width: 65px;
            height: 65px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin: 0 auto 12px;
        }

        .crew-name {
            font-weight: 600;
            color: var(--dark-navy);
            font-size: 1.05rem;
        }

        .progress-bar-container {
            background-color: #edf2f7;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--caribbean-turquoise) 0%, var(--ocean-blue) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 6px;
            font-weight: 500;
        }

        .back-btn {
            background: #edf2f7;
            border: none;
            color: var(--dark-navy);
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .task-group-title {
            color: var(--dark-navy);
            margin: 25px 0 12px;
            font-size: 1.15rem;
            border-left: 5px solid var(--coral-orange);
            padding-left: 10px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #edf2f7;
        }

        .checklist-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
        }

        .checklist-item label {
            cursor: pointer;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .checklist-item.completed {
            background: #f1f5f9;
        }

        .checklist-item.completed label {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .info-card {
            background: #fffbeb;
            border-left: 4px solid #fbbf24;
            padding: 15px;
            margin-top: 30px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #78350f;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚢 ¡Rumbo al Caribe! ⚓</h1>
        <p>Coordinación y Preparativos de nuestro Crucero</p>
    </header>
    
    <div class="countdown-container" id="countdown">⏳ ¡Nos vemos el 8 de Noviembre! Preparando motores...</div>

    <div class="container">
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-crew" onclick="switchTab('crew')">👥 Listas Personales</button>
            <button class="tab-btn" id="btn-group" onclick="switchTab('group')">📦 Tareas Comunes</button>
        </div>

        <!-- VISTA TRIPULACIÓN -->
        <div id="view-crew" class="view-section active">
            <h2 style="text-align: center; color: var(--dark-navy);">Selecciona tu nombre:</h2>
            <div class="crew-grid" id="crew-grid"></div>
        </div>

        <!-- VISTA INDIVIDUAL -->
        <div id="view-individual" class="view-section">
            <button class="back-btn" onclick="switchTab('crew')">⬅ Volver a la lista general</button>
            <div class="profile-header">
                <div class="crew-avatar" id="active-avatar">🌴</div>
                <div style="flex-grow: 1;">
                    <h2 id="active-user-name">Nombre</h2>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="active-progress-bar"></div>
                    </div>
                    <div class="progress-text" id="active-progress-text">0% completado</div>
                </div>
            </div>
            <div id="individual-tasks-container"></div>
        </div>

        <!-- VISTA GRUPAL -->
        <div id="view-group" class="view-section">
            <h2 style="color: var(--dark-navy); margin-bottom: 10px;">📦 Tareas Comunes del Grupo</h2>
            <div id="group-tasks-container"></div>
        </div>
    </div>
